spring.application.name=property-listing-management
server.port=8080

# MySQL database configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/property_sales_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Property image upload settings
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
property.image.upload-directory=${PROPERTY_IMAGE_DIR:uploads/property-images}
