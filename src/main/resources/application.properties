# Application
spring.application.name=property-listing-management
server.port=8080

# SQL Server Express on local TCP port 1433
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=PropertySalesDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:property_app}
spring.datasource.password=${DB_PASSWORD:PropertyApp@123}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Property image uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
property.image.upload-directory=${PROPERTY_IMAGE_DIR:uploads/property-images}